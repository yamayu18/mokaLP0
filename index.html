<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百花ゼロジェル LP</title>
    <style>
      :root {
        --page-width: 390px;
        --page-bg: #f6f3eb;
        --frame-bg: #ffffff;
        --frame-shadow: 0 20px 50px rgba(84, 66, 35, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #f8f7f1 0%, #efe9dd 100%);
        color: #222;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .lp {
        width: var(--page-width);
        margin: 0 auto;
        background: var(--frame-bg);
        box-shadow: var(--frame-shadow);
      }

      .lp-section {
        position: relative;
        display: block;
      }

      .lp-section img {
        display: block;
        width: 100%;
        height: auto;
      }

      .cta-link {
        position: absolute;
        display: block;
        z-index: 1;
      }

      .section-a .cta-link {
        left: 34.7%;
        top: 86.8%;
        width: 58.0%;
        height: 8.4%;
      }

      .section-f .cta-link {
        left: 2.6%;
        top: 82.0%;
        width: 91.2%;
        height: 14.2%;
      }

      .section-d .cta-link {
        left: 54.8%;
        top: 95.2%;
        width: 41.8%;
        height: 4.5%;
      }

      .section-g .cta-link-secondary {
        position: absolute;
        left: 3.0%;
        top: 82.8%;
        width: 93.0%;
        height: 14.6%;
        display: block;
        z-index: 1;
      }

      .section-g .cta-link-tertiary {
        position: absolute;
        left: 54.6%;
        top: 73.6%;
        width: 41.8%;
        height: 5.2%;
        display: block;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <main class="lp">
      <section class="lp-section section-a">
        <img src="./images/a.png" alt="百花ゼロジェル メインビジュアル" />
        <a
          class="cta-link"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/b.png" alt="お口の悩み" />
      </section>
      <section class="lp-section">
        <img src="./images/c.png" alt="ピリピリ感に関する調査" />
      </section>
      <section class="lp-section section-d">
        <img src="./images/d.png" alt="国内工場と品質試験" />
        <a
          class="cta-link"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/e.png" alt="ランキングとレビュー" />
      </section>
      <section class="lp-section section-f">
        <img src="./images/f.png" alt="ランキングとレビュー" />
        <a
          class="cta-link"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section section-g">
        <img src="./images/g.png" alt="選ばれる理由" />
        <a
          class="cta-link-tertiary"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
        <a
          class="cta-link-secondary"
          href="https://www.hyakka-market.com/product-detail.html"
          aria-label="商品詳細ページへ移動"
        ></a>
      </section>
      <section class="lp-section">
        <img src="./images/h.png" alt="使い方とよくある質問" />
      </section>
    </main>
  </body>
</html>
